name: CI

# A gate that only runs when someone remembers to run it is not a gate (AOC-003).
# A red build blocks the MERGE, not the release.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first: the only run that matters is the latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # ⭐ A real Postgres, because the thing under test in internal/db is SQL, and SQL that
    # has never met a database is not tested. Without this the migration and sqlc tests
    # SKIP here — and a suite that skips its only integration tests while reporting
    # success is the exact shape this project has spent four tickets removing.
    #
    # ⭐ ONE RULE FOR EVERY POSTGRES IN THIS PROJECT: they all track PRODUCTION's major.
    # Railway runs 18.6, so production, docker-compose.yml, Makefile's POSTGRES_MAJOR and this
    # pin are all 18. Bump production and you bump all four in the same commit.
    #
    # ⚠️ This pin was left at 17 when the others moved to 18 (AOC-004 verify round 2), which put
    # CI a major BEHIND production — the worst of the three to get wrong: it runs on every PR,
    # it holds the only real SQL tests, and nobody looks at it while it is green. The comment
    # that used to live here also had the danger inverted, warning about production being OLDER.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aoc
          POSTGRES_PASSWORD: aoc
          POSTGRES_DB: aoc_dev
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails intermittently —
        # the worst kind of red build, because it goes green on a re-run.
        options: >-
          --health-cmd "pg_isready -U aoc -d aoc_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://aoc:aoc@localhost:5432/aoc_dev?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # Pinned FROM go.mod, never duplicated here: one source of truth for the Go version,
      # so a toolchain bump is a one-line change in the file that already declares it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CI calls the SAME make targets a person calls, and the same ones `bin/gate api` calls
      # in the product_management repo. A duplicated command list here is how CI and the local
      # gate drift until one of them is lying.
      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make lint

      - name: go build
        run: make compile

      - name: go test
        run: make test

      # The integration tests skip when no database is reachable. That skip is legitimate
      # on a laptop and NOT legitimate here, so CI asserts they actually ran.
      - name: the database tests really ran
        run: |
          out="$(go test ./internal/db/ -v -count=1 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "SKIP"; then
            echo "::error::internal/db tests SKIPPED in CI — the Postgres service is not reachable,"
            echo "::error::so the migration and sqlc tests proved nothing."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # REQUIRED, not advisory (AOC-003). golangci-lint is the only thing that catches an ALIASED
      # import evading the http.Error ban -- `nh "net/http"` then `nh.Error(...)` -- which
      # bin/gate's grep for the literal `http.Error(` can never see. bin/gate still warns and skips
      # when the binary is absent locally; CI is the authority.
      #
      # Installed with `go install` at a PINNED version rather than through a third-party action:
      # the config schema is version-specific (v2 here), so the binary that runs in CI must be the
      # same one .golangci.yml was verified against locally. An action whose default version moves
      # is how a config becomes wrong without anyone editing it.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: config is valid
        run: golangci-lint config verify

      - name: golangci-lint
        run: golangci-lint run ./...
