{{define "content"}}
<h1 class="text-2xl font-semibold text-link">Rendering smoke page</h1>
<p class="mt-4 text-muted">
  This page exists to prove the rendering pipeline, not to be read. It is
  <code class="text-link">noindex</code> and a later ticket deletes it.
</p>

<p class="mt-6 text-muted">Server-rendered marker: <strong>{{.Data.Marker}}</strong></p>

<form class="mt-8" method="post" action="/_smoke/echo">
  <label class="block text-sm text-muted" for="say">Say something</label>
  <input id="say" name="say" value="hello"
         class="mt-1 w-64 rounded border border-line bg-ink-2 px-2 py-1">
  <button type="submit"
          hx-post="/_smoke/echo" hx-target="#echo" hx-swap="innerHTML"
          class="ml-2 rounded bg-link px-3 py-1 font-medium text-ink">Echo</button>
</form>

<div id="echo" class="mt-4">{{template "echo" .Data}}</div>
{{end}}
