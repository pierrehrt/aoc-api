{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.View.Title}}</title>
<meta name="description" content="{{.View.Description}}">
<link rel="canonical" href="{{.View.Canonical}}">
{{if .View.NoIndex}}<meta name="robots" content="noindex">{{end}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{.View.Title}}">
<meta property="og:description" content="{{.View.Description}}">
<meta property="og:url" content="{{.View.Canonical}}">
{{if .View.OGImage}}<meta property="og:image" content="{{.View.OGImage}}">
<meta name="twitter:card" content="summary_large_image">{{end}}
{{with .View.JSONLD}}<script type="application/ld+json">{{.}}</script>
{{end}}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-ink font-sans text-paper antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:p-3">Skip to content</a>
<header class="border-b border-line">
  <div class="mx-auto flex max-w-7xl flex-wrap items-baseline gap-x-6 gap-y-1 px-4 py-3">
    <a href="/" class="text-base font-semibold tracking-tight text-paper">AoC Codex</a>
    <nav aria-label="Sections" class="flex flex-wrap gap-x-4 text-sm">
      {{range .View.Nav}}<a href="{{.Path}}" class="text-muted hover:text-paper">{{.Label}}</a>{{end}}
    </nav>
  </div>
</header>
<main id="main" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8">
{{template "content" .}}
</main>
<footer class="border-t border-line">
  <div class="mx-auto max-w-7xl px-4 py-6 text-xs text-muted"></div>
</footer>
</body>
</html>{{end}}
