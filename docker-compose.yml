# LOCAL POSTGRES ONLY. This file never runs in production.
#
# There is exactly one hosted environment (DECISIONS.md, 2026-09-16 — no revenue, so no second
# Postgres to pay for). The rule that a second environment used to protect is kept and made
# stricter: a migration's first execution is against THIS database, loaded from a real production
# dump, so it meets the actual data rather than an empty schema.
#
#   make db-up        start it
#   make db-restore   load the newest dump from ./tmp/dumps into it
#   make db-reset     throw it away and start clean
#
# ⚠️ THE MAJOR VERSION MUST BE >= THE ONE RAILWAY RUNS. Railway runs **18.6**
# (ghcr.io/railwayapp-templates/postgres-ssl:18), so this pins 18.
#
# ⭐ The reason, measured 2026-09-16 — and NOT the reason this comment used to give.
# It said "pg_dump output from a newer server does not restore into an older one". That was
# never tested and is wrong: a 18.6 custom-format dump restores into 17.11 fine.
# What actually bites is one step earlier:
#
#     pg_dump: error: aborting because of server version mismatch
#     pg_dump: detail: server version: 18.6; pg_dump version: 17.11
#
# pg_dump REFUSES to read a server newer than itself. With a 17 client, step 1 of the
# four-step migration loop — take a production dump — cannot run at all. It appeared to work
# only because this Mac happens to have a Homebrew pg_dump 18.6 on $PATH: undocumented luck,
# on the single step the whole "no second hosted environment" trade rests on.
# Found by AOC-004 verify round 1.

services:
  db:
    image: postgres:18-alpine
    container_name: aoc-postgres
    environment:
      POSTGRES_USER: aoc
      POSTGRES_PASSWORD: aoc
      POSTGRES_DB: aoc_dev
    ports:
      # 5433, not 5432: a Postgres already installed on the host owns 5432, and silently talking
      # to the wrong database is the kind of mistake this whole setup exists to prevent.
      - "5433:5432"
    volumes:
      # ⚠️ /var/lib/postgresql, NOT /var/lib/postgresql/data. The 18+ images store data in
      # major-version-specific subdirectories so `pg_ctlcluster` and `pg_upgrade` work, and a
      # volume mounted at the old /data path makes the container refuse to start:
      #   "there appears to be PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)"
      # Bumping the pin is therefore not just a number change. Measured on the 17 → 18 bump.
      - aoc-pgdata:/var/lib/postgresql
      # ⚠️ NO bind mount for dumps. `make db-restore` streams the file over stdin instead.
      # A bind mount would need the container runtime's VM to share this path, and it does
      # not: this repo lives on an external volume (/Volumes/SSD_pierre), which Colima does
      # not mount by default. The VM showed the directory structure but no contents, so the
      # mount silently resolved to an EMPTY directory — measured, not assumed. Streaming
      # over stdin works wherever the repo lives and on anyone's machine.
    healthcheck:
      # `make db-restore` waits on this. Postgres accepts connections briefly during init and
      # then restarts, so a plain "is the port open" check can connect to a server that is about
      # to go away.
      test: ["CMD-SHELL", "pg_isready -U aoc -d aoc_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  aoc-pgdata:
